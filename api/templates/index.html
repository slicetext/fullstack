<!doctype html>
<html>
    <head>
	<script src = "/static/script.js" defer></script>
	<link rel="stylesheet" href="/static/style.css">

        <title>IP Address Assignments | IP Address Tracker</title>
    </head>
    <body>
	    <button id="login_button" onclick="window.location.href='{{ url_for('login_page') }}'">Not Logged In</button>
	<button id="logout_button">logout</button>

            </table>

	    <input placeholder=description></input>

            <input type="text" id="search" placeholder="search">
            <table id = "assigned_addresses">
                <thead>
                    <tr>
                        <th>Address</th>
                        <th>Owner</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id = "assigned_addresses_rows">
                </tbody>
            </table>
        </div>
    </body>
